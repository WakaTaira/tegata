name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Run Nix checks
        run: nix flake check

      - name: Install npm dependencies
        run: nix develop -c npm ci

      - name: Run acceptance tests
        run: nix develop -c npm run test:acceptance

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run unit tests
        run: cargo test --workspace --features tegatad/mock-provider --locked

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build the daemon and the bridge
        run: nix build .#tegatad .#tegata-bridge

      - name: Install npm dependencies
        run: nix develop -c npm ci

      - name: Run container acceptance tests
        run: nix develop -c npm run test:container
